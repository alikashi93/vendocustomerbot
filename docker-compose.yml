services:
  vendo-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vendo-customer-bot
    restart: unless-stopped
    # بدون هیچ port mapping — بات فقط polling است و پورتی لازم ندارد
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
